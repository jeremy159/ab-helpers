# Example CLI overrides for ~/.config/ab-helpers/config.toml
#
# `abh init` copies base.toml here as the defaults floor and writes a starter
# config.toml; this file layers on top of base.toml, so only set what you need
# to change. `ABH_`-prefixed env vars still override these values.
#
# `password` and `sync_id` are secrets. Rather than writing them here, prefer
# pointing at a file with ABH_ACTUAL__PASSWORD_FILE / ABH_ACTUAL__SYNC_ID_FILE
# (see the README's Configuration section) so the real values never sit in
# this toml file.

[actual]
server_url = "https://your-actual-server"
password = "your-password"
sync_id = "your-sync-id"
# Override the default cache location (~/.local/share/ab-helpers/cache) if you
# want the synced budget + daemon state somewhere else:
# cache_dir = "/absolute/path/to/cache"

[actual.kia]
account_id = "your-kia-account-id"

[actual.mortgage]
account_id = "your-mortgage-account-id"

[actual.set_balance]
# Default payee name for `abh set-balance` adjustments; still overridable
# per call with --payee-name.
payee_name = "Balance Adjustment"

# `abh budget-summary`: one entry per person. `salary_payee` is the Actual
# payee name (case-insensitive) of this person's regular paycheque;
# `allocation_payees` are any other income payees (benefits, allowances,
# etc.) summed separately. The person's `name` is also used to classify
# expense categories as individual to them (a category whose name contains
# this string, case-insensitive - e.g. "Auto - Jeremy" - counts as
# Jeremy's, otherwise it's treated as a shared/common expense).
# [[actual.budget_summary.persons]]
# name = "Jeremy"
# salary_payee = "Employer Inc"
#
# [[actual.budget_summary.persons]]
# name = "Sandryne"
# salary_payee = "Sandryne's Employer"
# allocation_payees = ["Canada Child Benefit"]
